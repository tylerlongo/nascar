<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NASCAR Prediction Model</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Google+Sans+Flex:opsz,wght@17,800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --panel: #111118;
  --panel2: #15151f;
  --border: #222230;
  --accent: #fde725;
  --accent-rgb: 253,231,37;
  --text: #e8e8f0;
  --muted: #555568;
  --mono: 'Space Mono', monospace;
  --sans: var(--mono);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { height: 100vh; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--sans); display: flex; flex-direction: column; }
#topbar { display:flex; align-items:center; gap:12px; padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--border); flex-shrink:0; flex-wrap:wrap; }
#topbar h1 { font-family:var(--mono); font-size:13px; letter-spacing:.15em; color:var(--accent); text-transform:uppercase; white-space:nowrap; }
.meta { font-family:var(--mono); font-size:11px; color:var(--muted); }
.meta span { color:var(--accent); }
#btn-refresh { margin-left:auto; }
#toolbar { display:flex; align-items:center; gap:8px; padding:6px 16px; background:var(--panel); border-bottom:1px solid var(--border); flex-shrink:0; flex-wrap:wrap; }
.select { height:28px; max-width:260px; background:#1a1a25; border:1px solid var(--border); border-radius:5px; color:var(--muted); font-family:var(--mono); font-size:10px; padding:0 9px; outline:none; }
.select:hover, .select:focus { border-color:var(--accent); color:var(--text); }
.btn {
  height:28px; padding:0 11px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:#1a1a25; border:1px solid var(--border); border-radius:5px; color:var(--muted);
  font-family:var(--mono); font-size:10px; cursor:pointer; user-select:none; transition:.15s;
}
.btn:hover { border-color:var(--accent); color:var(--text); }
.btn.active { color:var(--text); border-color:var(--accent); background:rgba(var(--accent-rgb),.08); }
.divider { width:1px; height:18px; background:var(--border); margin:0 3px; }
.mode-toggle { display:inline-flex; background:#1a1a25; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.mode-btn { height:28px; padding:0 13px; background:transparent; border:none; color:var(--muted); font-family:var(--mono); font-size:10px; cursor:pointer; transition:.15s; }
.mode-btn:hover { color:var(--text); }
.mode-btn.active { background:rgba(var(--accent-rgb),.12); color:var(--accent); }
#main { display:grid; grid-template-columns:minmax(460px, 1fr) 430px 210px; flex:1; min-height:0; overflow:hidden; }
#ranking-panel { display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden; border-right:1px solid var(--border); }
#ranking-header { padding:14px 16px 10px; border-bottom:1px solid var(--border); background:var(--panel); }
#ranking-header h2, #pca-side h2, #side h2 { font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:9px; }
#search { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:7px 10px; font-family:var(--sans); font-size:13px; color:var(--text); outline:none; }
#search:focus { border-color:var(--accent); }
#rank-head { display:grid; grid-template-columns:42px 70px 1fr 92px 74px 72px; gap:9px; padding:10px 16px 8px; color:var(--muted); font-family:var(--mono); font-size:10px; border-bottom:1px solid var(--border); background:var(--panel); }
#rank-list { flex:1; min-height:0; overflow:auto; padding:8px 12px 18px; }
.rank-row { display:grid; grid-template-columns:42px 70px 1fr 92px 74px 72px; gap:9px; align-items:center; padding:8px 8px; border-bottom:1px solid rgba(255,255,255,.045); border-radius:4px; cursor:pointer; }
#rank-head.has-start { grid-template-columns:42px 70px 1fr 56px 92px 74px 72px; }
.rank-row.has-start { grid-template-columns:42px 70px 1fr 56px 92px 74px 72px; }
.rank-row:hover { background:rgba(var(--accent-rgb),.07); }
.rank-row.selected { background:rgba(var(--accent-rgb),.11); outline:1px solid rgba(var(--accent-rgb),.35); }
.rank-num { font-family:var(--mono); font-size:10px; color:var(--muted); }
.car-badge { font-family:var(--mono); color:var(--accent); font-weight:700; font-size:13px; }
.car-tile {
  --num-bg:#050507;
  --num-color:var(--accent);
  --num-outline:#ffffff;

  display:inline-flex;
  align-items:center;
  justify-content:center;

  background:var(--num-bg);

  border:none;
  border-radius:6px;

  overflow:hidden;
}

.car-tile.small {
  width:58px;
  height:34px;
}

.car-tile.big {
  width:140px;
  height:82px;
  border-radius:10px;
}

.car-tile .num-text {
  display:block;

  font-family: 'Google Sans Flex', sans-serif;
  font-weight: 800;

  font-variation-settings:
    "wght" 800;

  line-height:1;

  color:var(--num-color);

  -webkit-text-stroke:2.5px var(--num-outline);
  paint-order:stroke fill;

  text-shadow:none;

  transform:translateY(1px);
}

.car-tile.small .num-text {
  font-size:27px;
}

.car-tile.big .num-text {
  font-size:65px;
  -webkit-text-stroke:5.8px var(--num-outline);
}
.driver-hero { display:flex; align-items:center; gap:14px; margin:2px 0 10px; }
.car-big { margin:0; }
.driver-small { font-family:var(--mono); font-size:11px; color:var(--muted); margin-bottom:10px; }
.driver-name { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.limited-pill { display:inline; margin-left:10px; padding:0; border:none; border-radius:0; background:transparent; color:var(--accent); font-family:var(--mono); font-size:24px; line-height:1; vertical-align:baseline; }
.limited-history-note { margin:8px 0 10px; padding:7px 8px; border:1px solid rgba(var(--accent-rgb),.25); border-radius:6px; background:rgba(var(--accent-rgb),.055); color:var(--muted); font-family:var(--mono); font-size:10px; line-height:1.45; }
.score { font-family:var(--mono); font-size:15px; font-weight:700; color:var(--text); }
.subscore { font-family:var(--mono); color:var(--muted); font-size:11px; }
#pca-side, #side { display:flex; flex-direction:column; min-height:0; overflow:hidden; background:var(--panel); }
#side { border-right:1px solid var(--border); }
#pca-header, #side-header { padding:14px 16px 10px; border-bottom:1px solid var(--border); flex-shrink:0; }
#side-header-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
#pca-content, #side-content { flex:1; min-height:0; overflow:auto; padding:14px 16px 20px; }
.empty { color:var(--muted); font-family:var(--mono); font-size:11px; line-height:1.7; }
.card { background:rgba(255,255,255,.025); border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:12px; }
.card-title { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:10px; }
.card-title b { font-family:var(--mono); color:var(--accent); font-size:13px; }
.card-title span { font-family:var(--mono); color:var(--muted); font-size:10px; }
.bigline { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
.metric { background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:9px; }
.metric .label { font-family:var(--mono); color:var(--muted); font-size:9px; text-transform:uppercase; letter-spacing:.08em; }
.metric .value { font-family:var(--mono); font-weight:700; font-size:22px; color:var(--text); margin-top:2px; }
.bar-row { display:grid; grid-template-columns:58px 1fr 74px; gap:8px; align-items:center; margin:8px 0; }
.bar-label { font-family:var(--mono); font-size:10px; color:var(--muted); }
.bar-track { height:10px; background:var(--bg); border:1px solid var(--border); border-radius:99px; overflow:hidden; }
.bar-fill { height:100%; border-radius:99px; }
.bar-val { font-family:var(--mono); font-size:10px; color:var(--text); text-align:right; }
.compare-grid { display:grid; gap:8px; }
.compare-row { display:grid; grid-template-columns:66px 1fr 76px; gap:8px; align-items:center; }
.note { color:var(--muted); font-family:var(--mono); font-size:10px; line-height:1.55; margin-top:8px; }
.score-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:10px; }
.score-grid .metric .value { font-size:18px; }
.winner { color:var(--accent); }
.sort-head { cursor:pointer; user-select:none; white-space:nowrap; }
.sort-head:hover, .sort-head.active { color:var(--accent); }
.sort-head.active::after { content:' ↑'; color:var(--accent); }
.sort-head.desc.active::after { content:' ↓'; }
.prediction-rank { display:grid; gap:12px; }
.prediction-rank-row { display:grid; grid-template-columns:28px 1fr auto; gap:10px; align-items:baseline; }
.prediction-rank-num { font-family:var(--mono); color:var(--muted); font-size:12px; }
.prediction-rank-name { font-family:var(--mono); color:var(--text); font-size:15px; font-weight:400; }
.prediction-rank-name.tyler { color:var(--accent); font-weight:700; }
.prediction-rank-score { font-family:var(--mono); color:var(--text); font-size:15px; font-weight:700; white-space:nowrap; }
.prediction-season-avg { color:var(--muted); font-weight:400; }
.prediction-rank-cars { grid-column:2 / 4; display:flex; gap:5px; flex-wrap:nowrap; margin-top:-5px; }
.prediction-results { border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:2px; }
.pca-component { margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--border); }
.pca-component:last-child { border-bottom:none; }
.pca-component-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px; }
.pca-component-name { color:var(--accent); font-family:var(--mono); font-size:12px; font-weight:700; }
.pca-component-impact { color:var(--muted); font-family:var(--mono); font-size:9px; }
.pca-driver-tiles { display:grid; grid-template-columns:repeat(5, 28px); gap:7px; align-items:start; }
.pca-driver-contribution { display:flex; flex-direction:column; align-items:center; gap:2px; }
.pca-driver-ev { color:var(--accent); font-family:var(--mono); font-size:8px; line-height:1; }
.pca-loadings { color:var(--muted); font-family:var(--mono); font-size:8px; line-height:1.4; margin-top:6px; }
.car-tile.tiny { width:28px; height:20px; border-radius:4px; }
.car-tile.clickable { cursor:pointer; }
.car-tile.clickable:hover { outline:1px solid var(--accent); }
.car-tile.tiny .num-text { font-size:15px; -webkit-text-stroke:1.25px var(--num-outline); transform:translateY(0); }

.detail-top { margin-bottom:12px; }
.market-list { margin-top:8px; }
.stat-compact { display:grid; grid-template-columns:1fr auto; row-gap:7px; column-gap:12px; margin:12px 0 14px; }
.stat-compact .label { font-family:var(--mono); color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.08em; }
.stat-compact .value { font-family:var(--mono); color:var(--text); font-size:16px; font-weight:700; text-align:right; }
.compare-simple { display:grid; gap:10px; }
.compare-simple-row { display:grid; grid-template-columns:70px 1fr 78px; gap:10px; align-items:center; }
.similar-table { display:grid; gap:0; }
.similar-head, .similar-row { display:grid; grid-template-columns:42px 36px minmax(120px,1fr) 34px 38px 30px; gap:6px; align-items:center; }
.similar-head { padding:0 2px 7px; color:var(--muted); font-family:var(--mono); font-size:10px; letter-spacing:.02em; border-bottom:1px solid var(--border); }
.similar-row { min-height:40px; padding:7px 2px; border-bottom:1px solid rgba(255,255,255,.045); font-family:var(--mono); font-size:11px; }
.similar-row:last-child { border-bottom:none; }
.similar-year, .similar-race { color:var(--muted); }
.similar-driver { color:var(--text); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.similar-score { color:var(--accent); text-align:right; }
.similar-finish { color:var(--text); font-weight:700; text-align:right; }
.car-tile.micro { width:34px; height:24px; border-radius:4px; }
.car-tile.micro .num-text { font-size:18px; -webkit-text-stroke:1.4px var(--num-outline); transform:translateY(0); }

::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
@media (max-width: 1100px) { #main { grid-template-columns:1fr; } #pca-side, #side { display:none; } #rank-head, .rank-row { grid-template-columns:38px 58px 1fr 76px 64px 62px; } #rank-head.has-start, .rank-row.has-start { grid-template-columns:38px 58px 1fr 48px 76px 64px 62px; } }
</style>
</head>
<body>
<div id="topbar">
  <h1>NASCAR&nbsp;Prediction&nbsp;Model</h1>
  <div class="meta" id="race-meta">—</div>
  <button class="btn" id="btn-refresh" onclick="refreshData()" title="Incremental scrape + rebuild predictions">↻ Refresh data</button>
</div>
<div id="toolbar">
  <div class="mode-toggle" id="mode-toggle">
    <button class="mode-btn active" id="btn-last-race" onclick="setMode('last_race')">Last Race</button>
    <button class="mode-btn" id="btn-next-race" onclick="setMode('next_race')">Next Race</button>
    <button class="mode-btn" id="btn-historical" onclick="setMode('historical')">Historical</button>
  </div>
  <select class="select" id="hist-year" style="display:none"><option value="">Year</option></select>
  <select class="select" id="hist-race" style="display:none"><option value="">Race</option></select>
  <button class="btn" id="btn-run-hist" style="display:none" onclick="runHistorical()">▶ Run</button>
  <select class="select" id="series-select" title="Series">
    <option value="cup">Cup Series</option>
    <option value="oreilly">O’Reilly Series</option>
    <option value="truck">Truck Series</option>
  </select>
  <div class="divider"></div>
  <select class="select" id="display-select" title="Odds format">
    <option value="prob">Probability</option>
    <option value="frac">Fractional</option>
    <option value="ml">Moneyline</option>
  </select>
  <select class="select" id="manufacturer-select" title="Manufacturer">
    <option value="">Manufacturers</option>
    <option value="Chevrolet">Chevrolet</option>
    <option value="Ford">Ford</option>
    <option value="Toyota">Toyota</option>
  </select>
  <select class="select" id="team-select"><option value="">Teams</option></select>
</div>
<div id="main">
  <section id="ranking-panel">
    <div id="ranking-header">
      <h2>Projected Field Ranking</h2>
      <input id="search" placeholder="Search driver or car #…" autocomplete="off" />
    </div>
    <div id="rank-head"></div>
    <div id="rank-list"></div>
  </section>
  <aside id="side">
    <div id="side-header">
      <div id="side-header-top">
        <div>
          <h2 id="side-title">Driver Detail</h2>
          <div class="meta"><span id="selected-count">0</span> selected</div>
        </div>
        <button class="btn" id="clear-selection" style="display:none">Clear selection</button>
      </div>
    </div>
    <div id="side-content"><div class="empty">Select one driver to see cumulative markets. Select two for head-to-head. Select 3+ for probability each finishes best of the group.</div></div>
  </aside>
  <aside id="pca-side">
    <div id="pca-header">
      <h2>Principal Components</h2>
      <div class="meta" id="pca-meta">—</div>
    </div>
    <div id="pca-content"><div class="empty">PCA summary loads with prediction data.</div></div>
  </aside>
</div>
<script>
let DATA_LAST=null, DATA_NEXT=null, DATA_HIST=null, HIST_INDEX=[];
const SEASON_COMPARISON_CACHE = new Map();
let mode='last_race';   // 'last_race' | 'next_race' | 'historical'
let series='cup';
let track='s', rankMode='prediction', sortDir='asc', displayMode='prob', selected=new Set(), query='';
const $ = sel => document.querySelector(sel);
const MARKET_KEYS = [
  ['win','Win'], ['top3','Top 3'], ['top5','Top 5'], ['top10','Top 10'], ['top15','Top 15'], ['top20','Top 20'], ['top25','Top 25']
];

function activeData(){ return mode==='last_race' ? DATA_LAST : (mode==='historical' ? DATA_HIST : DATA_NEXT); }
function seriesSuffix(){ return series === 'cup' ? '' : `_${series}`; }
function predictionFile(){ return `predictions${seriesSuffix()}.json`; }
function legacyPredictionFile(){ return `predictions_next_race${seriesSuffix()}.json`; }
async function loadNextRacePrediction(){
  const candidates=[predictionFile(), legacyPredictionFile()];
  for(const file of candidates){
    try{
      const res=await fetch(file+'?_='+Date.now());
      if(res.ok) return await res.json();
    }catch(_e){}
  }
  throw new Error('No next-race prediction file found.');
}
function latestHistoricalEntry(){
  return [...HIST_INDEX].filter(e=>e.predicted).sort((a,b)=>(Number(b.season)-Number(a.season))||(Number(b.race_num)-Number(a.race_num)))[0] || null;
}
async function loadLastRaceFromHistory(){
  const entry=latestHistoricalEntry();
  if(!entry){ DATA_LAST=null; return; }
  const res=await fetch(entry.file+'?_='+Date.now());
  if(!res.ok) throw new Error('HTTP '+res.status);
  DATA_LAST=await res.json();
}
function apiUrl(path){ return `${path}${path.includes('?') ? '&' : '?'}series=${encodeURIComponent(series)}`; }

async function loadSeriesData(){
  const preferredMode = mode;
  DATA_LAST=null; DATA_NEXT=null; DATA_HIST=null; HIST_INDEX=[]; selected.clear();
  SEASON_COMPARISON_CACHE.clear();
  const st=await fetch(apiUrl('/api/status'));
  if(!st.ok) throw new Error(`Series status failed: HTTP ${st.status}`);
  const payload=await st.json();
  // Verify that the backend honored the selected series. Surface the actual
  // mismatch rather than guessing why it happened.
  if(payload.series && payload.series !== series){
    throw new Error(`Series mismatch: requested ${series}, backend returned ${payload.series}.`);
  }
  if(Array.isArray(payload.index)) HIST_INDEX=payload.index;
  populateHistoricalControls();
  const [lr,nr]=await Promise.allSettled([
    loadLastRaceFromHistory(),
    loadNextRacePrediction(),
  ]);
  if(lr.status!=='fulfilled') DATA_LAST=null;
  if(nr.status==='fulfilled') DATA_NEXT=nr.value;
  const availableModes = {
    last_race: Boolean(DATA_LAST),
    next_race: Boolean(DATA_NEXT),
    historical: Boolean(HIST_INDEX.length),
  };
  mode = availableModes[preferredMode]
    ? preferredMode
    : (DATA_LAST ? 'last_race' : (DATA_NEXT ? 'next_race' : 'historical'));

  // Rebuilding the historical dropdowns selects a race, but that selection
  // does not fire a change event. Explicitly load it when the active mode is
  // historical (especially after switching series).
  if(mode === 'historical' && HIST_INDEX.length){
    await loadSelectedHistorical();
  }

  const data=activeData();
  if(data&&data.tracks) track=Object.keys(data.tracks)[0]||'s';
  toggleHistoricalControls(); updateRunButton();
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.id===`btn-${mode.replace('_','-')}`));
  $('#btn-last-race').disabled=false;
  $('#btn-next-race').disabled=false;
  $('#btn-historical').disabled=false;
  await loadSeasonComparison(activeSeason());
}

function seriesLabel(key=series){
  return ({cup:'Cup',oreilly:'O’Reilly',truck:'Truck'})[key] || 'Cup';
}

function seriesFullName(key=series){
  return ({
    cup:'NASCAR Cup Series',
    oreilly:'NASCAR O’Reilly Series',
    truck:'NASCAR Craftsman Truck Series',
  })[key] || 'NASCAR Cup Series';
}

function applySeriesTheme(){
  const root=document.documentElement;
  if(series==='oreilly'){
    root.style.setProperty('--accent','#39e75f');
    root.style.setProperty('--accent-rgb','57,231,95');
  }else if(series==='truck'){
    root.style.setProperty('--accent','#ff8c32');
    root.style.setProperty('--accent-rgb','255,140,50');
  }else{
    root.style.setProperty('--accent','#fde725');
    root.style.setProperty('--accent-rgb','253,231,37');
  }
}

async function setSeries(value){
  series=value || 'cup';
  $('#series-select').value=series;
  applySeriesTheme();
  const label=seriesLabel();
  setStatus(`Loading ${label} Series...`);
  try{
    await loadSeriesData();
    if(!DATA_LAST&&!DATA_NEXT&&!HIST_INDEX.length){
      $('#rank-head').innerHTML='';
      $('#rank-list').innerHTML=`<div class="empty"><b>${label} Series selected.</b><br>No data yet — click <b>↻ Refresh data</b> to build it.</div>`;
      $('#side-content').innerHTML='<div class="empty">No prediction data loaded for this series yet.</div>';
      setStatus(`${label} Series · no data yet`);
      return;
    }
    setStatus('');
    render();
  }catch(err){
    console.error(err);
    $('#rank-head').innerHTML='';
    $('#rank-list').innerHTML=`<div class="empty"><b>Could not switch to ${label} Series.</b><br>${escapeHtml(err.message)}</div>`;
    setStatus(err.message,true);
  }
}

async function setMode(m){
  mode = m;
  selected.clear();
  toggleHistoricalControls();
  updateRunButton();
  if(mode === 'historical' && HIST_INDEX.length){
    await loadSelectedHistorical();
  }
  await loadSeasonComparison(activeSeason());
  const data = activeData();
  if(data && data.tracks){
    const available = Object.keys(data.tracks);
    if(!available.includes(track)) track = available[0] || 's';
  }
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active', b.id===`btn-${m.replace('_','-')}`));
  if(!activeData()){
    const label = m === 'last_race' ? 'last-race' : (m === 'next_race' ? 'next-race' : 'historical');
    $('#rank-head').innerHTML='';
    $('#rank-list').innerHTML=`<div class="empty">No ${label} prediction data could be loaded for this series. Run <b>↻ Refresh data</b> to rebuild it.</div>`;
    $('#side-content').innerHTML='<div class="empty">No prediction data loaded.</div>';
    return;
  }
  render();
}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}
function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function toggleHistoricalControls(){
  const show = mode === 'historical';
  $('#hist-year').style.display = show ? '' : 'none';
  $('#hist-race').style.display = show ? '' : 'none';
}
function populateHistoricalControls(preferredYear=null, preferredRace=null){
  const yearSel = $('#hist-year');
  const raceSel = $('#hist-race');

  // Preserve whatever race the user had selected before rebuilding the option lists.
  // Without this, replacing innerHTML makes the browser select the first option again
  // (usually newest season + race 01, e.g. 2026 01).
  const keepYear = preferredYear ?? yearSel.value;
  const keepRace = preferredRace ?? raceSel.value;

  const years = [...new Set(HIST_INDEX.map(e=>String(e.season)))].sort((a,b)=>Number(b)-Number(a));
  yearSel.innerHTML = years.length
    ? years.map(y=>`<option value="${escapeHtml(y)}">${escapeHtml(y)}</option>`).join('')
    : '<option value="">No saved races</option>';

  if(years.includes(String(keepYear))) yearSel.value = String(keepYear);
  else if(years.length) yearSel.value = years[0];

  populateHistoricalRaceSelect(keepRace);
}
function populateHistoricalRaceSelect(preferredRace=null){
  const year = $('#hist-year').value;
  const raceSel = $('#hist-race');
  const keepRace = preferredRace ?? raceSel.value;
  const races = HIST_INDEX.filter(e=>String(e.season)===String(year)).sort((a,b)=>Number(a.race_num)-Number(b.race_num));
  raceSel.innerHTML = races.length
    ? races.map(e=>`<option value="${escapeHtml(e.race_num)}">${String(e.race_num).padStart(2,'0')} · ${escapeHtml(e.track_name || '')}</option>`).join('')
    : '<option value="">No races</option>';

  if(races.some(e=>String(e.race_num)===String(keepRace))) raceSel.value = String(keepRace);
}
function updateRunButton(){
  const year=$('#hist-year').value, raceNum=$('#hist-race').value, btn=$('#btn-run-hist');
  if(!btn) return;
  if(mode!=='historical'||!year||!raceNum){btn.style.display='none';return;}
  const entry=HIST_INDEX.find(e=>String(e.season)===String(year)&&String(e.race_num)===String(raceNum));
  const alreadyPredicted=Boolean(entry&&entry.predicted);
  btn.style.display=alreadyPredicted?'none':'';
  btn.textContent='▶ Run';
}

async function loadSelectedHistorical(){
  const year=$('#hist-year').value, raceNum=$('#hist-race').value;
  const entry=HIST_INDEX.find(e=>String(e.season)===String(year)&&String(e.race_num)===String(raceNum));
  if(!entry){DATA_HIST=null;return;}
  if(entry.predicted){
    setStatus(`Loading ${year} race ${raceNum}...`);
    try{
      const res=await fetch(entry.file+'?_='+Date.now());
      if(!res.ok) throw new Error('HTTP '+res.status);
      DATA_HIST=await res.json();
      track=Object.keys(DATA_HIST.tracks||{})[0]||'s';
      await loadSeasonComparison(activeSeason());
      setStatus('');
    }catch(e){setStatus('Could not load '+entry.file+': '+e.message,true);DATA_HIST=null;}
    return;
  }
  DATA_HIST=null;
  setStatus(year+' race '+raceNum+' not yet predicted — click ▶ Run');
}

async function runHistorical(){
  const year=$('#hist-year').value,raceNum=$('#hist-race').value;
  if(!year||!raceNum) return;
  const btn=$('#btn-run-hist'),orig=btn.textContent;
  btn.textContent='⏳ Building season…';btn.disabled=true;
  setStatus('Building all missing '+year+' historical predictions...');
  try{
    const res=await fetch('/api/run_historical',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({year:Number(year),race:Number(raceNum),series})});
    const data=await res.json();
    if(!data.ok){setStatus('Error: '+(data.error||'unknown'),true);return;}
    if(Array.isArray(data.index)){HIST_INDEX=data.index;populateHistoricalControls(year, raceNum);updateRunButton();}
    const fr=await fetch(data.file+'?_='+Date.now());
    if(!fr.ok) throw new Error('Could not load result: HTTP '+fr.status);
    DATA_HIST=await fr.json();
    track=Object.keys(DATA_HIST.tracks||{})[0]||'s';
    await loadSeasonComparison(activeSeason());
    setStatus('');render();
  }catch(e){setStatus('Failed: '+e.message,true);}
  finally{btn.textContent=orig;btn.disabled=false;updateRunButton();}
}

async function refreshData(){
  const btn=$('#btn-refresh'),orig=btn.textContent;
  btn.textContent='⏳ Refreshing…';btn.disabled=true;
  setStatus('Checking for new races and rebuilding predictions...');
  try{
    const res=await fetch(apiUrl('/api/scrape'),{method:'POST'});
    const data=await res.json();
    if(!data.ok){setStatus('Refresh error: '+(data.error||'check console'),true);console.error(data);return;}
    if(Array.isArray(data.index)){HIST_INDEX=data.index;populateHistoricalControls($('#hist-year').value, $('#hist-race').value);updateRunButton();}
    const[lr,nr]=await Promise.all([
      loadLastRaceFromHistory().then(()=>DATA_LAST).catch(()=>null),
      loadNextRacePrediction().catch(()=>null),
    ]);
    DATA_LAST=lr;if(nr)DATA_NEXT=nr;
    const d=activeData();if(d&&d.tracks)track=Object.keys(d.tracks)[0]||'s';
    SEASON_COMPARISON_CACHE.clear();
    await loadSeasonComparison(activeSeason());
    setStatus('');render();
  }catch(e){setStatus('Refresh failed: '+e.message,true);}
  finally{btn.textContent=orig;btn.disabled=false;}
}

function setStatus(msg,isError=false){
  const el=$('#race-meta');if(!el)return;
  if(msg){el.textContent=msg;el.style.color=isError?'#e05c5c':'var(--muted)';}
  else{el.textContent=buildRaceMeta();el.style.color='';}
}

function schemeEntryMatchesSeason(entry, season){
  if(!Array.isArray(entry) || entry.length < 4 || season === null) return false;
  const from = Number(entry[3]);
  const through = Number(entry[4] ?? entry[3]);
  return Number.isFinite(from) && Number.isFinite(through) && season >= from && season <= through;
}

function schemeEntryHasSeason(entry){
  return Array.isArray(entry) && entry.length >= 5;
}

function schemeColors(entry){
  return [entry[0], entry[1], entry[2]];
}

function activeSeason(){
  const data = activeData();
  const mm = data?.meta?.mode_meta || {};
  const race = mode === 'next_race' ? mm.target_race : mm.race;
  const season = Number(race?.season ?? data?.meta?.season);
  return Number.isFinite(season) ? season : null;
}

async function loadSeasonComparison(season=activeSeason()){
  if(!Number.isFinite(Number(season))) return;
  season = Number(season);
  try{
    const res = await fetch(apiUrl(`/api/season_comparison/${season}?_=${Date.now()}`));
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    SEASON_COMPARISON_CACHE.set(season, await res.json());
  }catch(e){
    console.warn('Could not load season comparison:', e);
    SEASON_COMPARISON_CACHE.set(season, {season, averages:{}, race_counts:{}});
  }
}

function carScheme(car, seasonOverride=null, seriesOverride=null){
  const key = String(car);
  const season = seasonOverride ?? activeSeason();
  const schemeSeries = seriesOverride || series;
  const schemes = schemeSeries === 'oreilly' ? OREILLY_CAR_SCHEMES : (schemeSeries === 'cup' ? CAR_SCHEMES : {});
  const raw = schemes[key];
  if(!raw) return [BLACK, WHITE, BLACK];

  // Every scheme entry is season-ranged: [bg, color, outline, fromSeason, throughSeason].
  for(const entry of raw){
    if(schemeEntryMatchesSeason(entry, season)) return schemeColors(entry);
  }

  return [BLACK, WHITE, BLACK];
}

function isBlackOrWhiteColor(c){
  const x = String(c ?? '').trim().toLowerCase().replace(/\s+/g, '');
  return [
    '#000', '#000000', 'black', 'rgb(0,0,0)', 'rgba(0,0,0,1)',
    '#fff', '#ffffff', 'white', 'rgb(255,255,255)', 'rgba(255,255,255,1)'
  ].includes(x);
}

function driverChartColor(car){
  const [bg, color, outline] = carScheme(car);

  // Prefer the car background. If that is black/white, try the number color,
  // then the outline. If all three are black/white, use white so the bar still
  // shows up on the dark dashboard.
  for(const c of [bg, color, outline]){
    if(!isBlackOrWhiteColor(c)) return c;
  }
  return WHITE;
}

function viridis(t){
  const stops=[[68,1,84],[72,35,116],[64,67,135],[52,94,141],[41,120,142],[32,144,140],[34,167,132],[68,190,112],[121,209,81],[189,223,38],[253,231,37]];
  t=clamp(t,0,1); const s=t*(stops.length-1); const i=Math.floor(s), f=s-i;
  if(i>=stops.length-1){const c=stops[stops.length-1];return `rgb(${c[0]},${c[1]},${c[2]})`;}
  const a=stops[i], b=stops[i+1];
  return `rgb(${Math.round(a[0]+f*(b[0]-a[0]))},${Math.round(a[1]+f*(b[1]-a[1]))},${Math.round(a[2]+f*(b[2]-a[2]))})`;
}

function sortValue(d, key){
  if(key === 'rank') return predictionValue(d);
  if(key === 'car') return String(d.car).padStart(3, '0');
  if(key === 'driver') return driverName(d).toLowerCase();
  if(key === 'result') return (mode === 'last_race' || mode === 'historical') ? Number(d.actual_finish) : Number(d.starting_position);
  if(key === 'expected_finish') return Number(d.expected_finish);
  if(key === 'prediction') return predictionValue(d);
  if(key === 'median_finish') return Number(d.median_finish ?? (d.pmf ? medianFromPmf(d.pmf) : NaN));
  if(key === 'win') return Number(d.win ?? cdfTop(d,1));
  return Number(d[key]);
}
function carTieKey(d){
  const c = String(d.car ?? '');
  return c.match(/^\d+$/) ? Number(c) : c;
}
function baseCompare(a,b,key,dir){
  const av = sortValue(a, key);
  const bv = sortValue(b, key);
  let cmp;
  if(typeof av === 'string' || typeof bv === 'string') cmp = String(av).localeCompare(String(bv));
  else cmp = (Number.isFinite(av) ? av : 9999) - (Number.isFinite(bv) ? bv : 9999);
  return dir === 'desc' ? -cmp : cmp;
}
function compareDrivers(a,b,key=rankMode,dir=sortDir){
  let cmp = baseCompare(a,b,key,dir);
  if(cmp !== 0) return cmp;

  // The interpolated prediction normally eliminates median ties. Keep EV as
  // a secondary fallback, followed by win probability and car number.
  const tieKeys = key === 'prediction'
    ? ['expected_finish', 'win']
    : (key === 'expected_finish' ? ['prediction', 'win'] : ['prediction', 'expected_finish']);

  for(const tk of tieKeys){
    if(tk === key) continue;
    const tdir = tk === 'win' ? 'desc' : 'asc';
    cmp = baseCompare(a,b,tk,tdir);
    if(cmp !== 0) return cmp;
  }

  const ac = carTieKey(a), bc = carTieKey(b);
  if(typeof ac === 'number' && typeof bc === 'number') return ac - bc;
  return String(ac).localeCompare(String(bc));
}
function filteredDrivers(){
  let arr = trackDrivers().filter(d=>!query || String(d.car).includes(query) || driverName(d).toLowerCase().includes(query.toLowerCase()));
  arr.sort((a,b)=>compareDrivers(a,b));
  return arr;
}

  return `<span class="limited-pill" title="Limited history: ${escapeHtml(parts.join(' + '))}">⚠</span>`;
}
function limitedHistoryNotice(d){
  if(!isLimitedHistory(d)) return '';
  const n = historyCount(d);
  const label = n === null ? 'under 10' : String(n);
  const raceWord = n === 1 ? 'race' : 'races';
  const teamFill = Number(d?.team_history_fill_count || 0);
  const neutralFill = Number(d?.neutral_history_fill_count || 0);
  const driverAvgFill = Number(d?.driver_avg_fill_count || 0);
  const startFill = Number(d?.start_pos_fill_count || 0);
  const modelCount = Number(d?.model_history_count || 0);
  const team = d?.canonical_team || d?.team || 'current team';
  let fillText = '';
  if(driverAvgFill || teamFill || startFill || neutralFill){
    const bits = [];
    if(driverAvgFill) bits.push(`${driverAvgFill} recent driver avg running-position value${driverAvgFill === 1 ? '' : 's'}`);
    if(teamFill) bits.push(`${teamFill} recent ${escapeHtml(team)} team avg running-position value${teamFill === 1 ? '' : 's'}`);
    if(startFill) bits.push(`${startFill} qualifying/start-position value${startFill === 1 ? '' : 's'}`);
    if(neutralFill) bits.push(`${neutralFill} neutral placeholder${neutralFill === 1 ? '' : 's'}`);
    fillText = ` The model padded this to ${modelCount || 10} rows using ${bits.join(' and ')}.`;
  }
  return `<div class="limited-history-note">Limited driver history: ${label} prior ${raceWord}.${fillText}</div>`;
}
function medianFromPmf(pmf){
  let acc=0; for(let i=0;i<pmf.length;i++){ acc += pmf[i]; if(acc>=0.5) return i+1; }
  return pmf.length;
}
function predictionFromPmf(pmf){
  let before = 0;
  for(let i=0;i<pmf.length;i++){
    const bucket = Number(pmf[i]) || 0;
    const after = before + bucket;
    if(after >= 0.5){
      if(bucket <= 0) return i + 1;
      return Math.max(1, i + (0.5 - before) / bucket);
    }
    before = after;
  }
  return pmf.length;
}
function predictionValue(d){
  const stored = Number(d.prediction);
  if(Number.isFinite(stored)) return stored;
  if(d.pmf && d.pmf.length) return predictionFromPmf(d.pmf);
  return Number(d.median_finish);
}
function cdfTop(d, n){
  if(d.cdf && d.cdf.length) return d.cdf[Math.min(n-1,d.cdf.length-1)] || 0;
  if(d.pmf && d.pmf.length) return d.pmf.slice(0,n).reduce((a,b)=>a+b,0);
  return 0;
}
function buildRaceMeta(){
  const data = activeData();
  if(!data) return '—';
  const mm = data.meta?.mode_meta || {};
  const seriesName = seriesFullName();
  const race = (mode === 'last_race' || mode === 'historical') ? (mm.race || {}) : (mm.target_race || {});
  const base = `Predicting: ${race.track_name || '?'} (${race.season || ''} ${seriesName} Race #${race.race_num || ''})`;

  if(mode === 'next_race' && mm.qualifying_available){
    const url = mm.qualifying_url || sourceUrl('qualifying', race.season, race.race_num);
    return `${base} · qualifying results from ${url}`;
  }
  if(mode === 'next_race' && mm.entry_list_available){
    const url = mm.entry_list_url || sourceUrl('entry', race.season, race.race_num);
    return `${base} · entry list from ${url}`;
  }
  return base;
}
function sourceUrl(kind, season, raceNum){
  const y = Number(season);
  const r = Number(raceNum);
  if(!Number.isFinite(y) || !Number.isFinite(r)) return '';
  const rr = String(r).padStart(2, '0');
  if(kind === 'qualifying') return `https://www.racing-reference.info/qual-results/${y}-${rr}/W`;
  if(kind === 'entry') return `https://www.racing-reference.info/entrylist/${y}-${rr}/W`;
  return '';
}

  const drivers=filteredDrivers();
  const showResult = showResultColumn();
  $('#rank-head').classList.toggle('has-start', showResult);
  $('#rank-head').innerHTML = showResult
    ? `${sortableHead('#','rank')}${sortableHead('Car','car')}${sortableHead('Driver','driver')}${sortableHead(resultColumnLabel(),'result')}${sortableHead('Prediction','prediction')}${sortableHead('EV','expected_finish')}${sortableHead('Win %','win')}`
    : `${sortableHead('#','rank')}${sortableHead('Car','car')}${sortableHead('Driver','driver')}${sortableHead('Prediction','prediction')}${sortableHead('EV','expected_finish')}${sortableHead('Win %','win')}`;
  $('#rank-list').innerHTML=drivers.map((d,i)=>{
    const med = d.median_finish ?? (d.pmf ? medianFromPmf(d.pmf) : 0);
    const resultCell = showResult ? `<div class="subscore">${fmtResultCol(d)}</div>` : '';
    return `<div class="rank-row ${showResult?'has-start ':''}${selected.has(String(d.car))?'selected':''}" data-car="${d.car}">
      <div class="rank-num">${i+1}</div><div>${numberTile(d.car, 'small')}</div><div class="driver-name" title="${escapeHtml([d.manufacturer,d.team].filter(Boolean).join(' · '))}">${escapeHtml(driverName(d))}${limitedBadge(d)}</div>
      ${resultCell}<div class="score">${Math.round(Number(med)||0)}</div><div class="subscore">${Number(d.expected_finish||0).toFixed(1)}</div><div class="subscore">${fmtP(d.win ?? cdfTop(d,1))}</div>
    </div>`;
  }).join('');
  document.querySelectorAll('.rank-row').forEach(row=>row.onclick=(e)=>{
    const car=String(row.dataset.car);
    if(e.shiftKey||e.metaKey||e.ctrlKey){ selected.has(car)?selected.delete(car):selected.add(car); }
    else { if(selected.size===1&&selected.has(car)) selected.clear(); else {selected.clear(); selected.add(car);} }
    render();
  });
  renderPca();
  renderSide();
}
function marketRows(d){
  const win = d.win ?? cdfTop(d,1);
  const top3 = d.top3 ?? cdfTop(d,3);
  const top5 = d.top5 ?? cdfTop(d,5);
  const top10 = d.top10 ?? cdfTop(d,10);
  const top15 = d.top15 ?? cdfTop(d,15);
  const top20 = d.top20 ?? cdfTop(d,20);
  const top25 = d.top25 ?? cdfTop(d,25);
  return [
    {label:'Win',   cum:win,   inc:win,          denom:1, range:'1'},
    {label:'Top 3', cum:top3,  inc:top3-win,     denom:2, range:'2-3'},
    {label:'Top 5', cum:top5,  inc:top5-top3,    denom:2, range:'4-5'},
    {label:'Top 10',cum:top10, inc:top10-top5,   denom:5, range:'6-10'},
    {label:'Top 15',cum:top15, inc:top15-top10,  denom:5, range:'11-15'},
    {label:'Top 20',cum:top20, inc:top20-top15,  denom:5, range:'16-20'},
    {label:'Top 25',cum:top25, inc:top25-top20,  denom:5, range:'21-25'}
  ].map(r=>{
    const inc = Math.max(0, r.inc);
    return {...r, inc, avg: inc / r.denom};
  });
}
function marketBars(d){
  const rows = marketRows(d);
  const maxAvg = Math.max(...rows.map(r=>r.avg), 0.001);
  return rows.map(r=>{
    const color = driverChartColor(d.car);
    return `<div class="bar-row" title="P${r.range}: ${asProb(r.inc)} · per-position ${asProb(r.avg)}"><div class="bar-label">${r.label}</div><div class="bar-track"><div class="bar-fill" style="width:${clamp(r.cum*100,0,100)}%;background:${color}"></div></div><div class="bar-val">${fmtP(r.cum)}</div></div>`;
  }).join('');
}
function pmfMini(d){
  if(!d.pmf) return '';
  const maxP = Math.max(...d.pmf, 0.001);
  const color = driverChartColor(d.car);
  return d.pmf.map((p,i)=>`<div class="bar-row"><div class="bar-label">P${i+1}</div><div class="bar-track"><div class="bar-fill" style="width:${clamp(p/maxP*100,0,100)}%;background:${color}"></div></div><div class="bar-val">${fmtP(p)}</div></div>`).join('');
}
function ordinal(n){
  const value=Number(n);
  if(!Number.isFinite(value)) return '—';
  const whole=Math.round(value), mod100=whole%100;
  if(mod100>=11&&mod100<=13) return `${whole}th`;
  return `${whole}${({1:'st',2:'nd',3:'rd'})[whole%10]||'th'}`;
}
function historicalSeriesCode(season, rowSeries){
  if((rowSeries||series)==='cup') return '';
  const year=Number(season)||0;
  if(year>=2026) return 'NOS';
  if(year>=2015) return 'NXS';
  if(year>=2008) return 'NNS';
  return 'NBS';
}
function historicalRaceLabel(season, raceNum, rowSeries){
  const year=Number(season);
  const yy=Number.isFinite(year) ? String(year%100).padStart(2,'0') : '—';
  const race=Number(raceNum);
  const raceText=Number.isFinite(race) ? String(Math.round(race)) : '—';
  const code=historicalSeriesCode(year,rowSeries);
  return `'${yy}${code ? ' '+code : ''} R${raceText}`;
}
function similarHistoricalCard(d){
  const currentSeason=Number(activeSeason());
  const rows=(Array.isArray(d.similar_historical_profiles) ? d.similar_historical_profiles : [])
    .filter(x=>!Number.isFinite(currentSeason) || Number(x.season) < currentSeason);
  if(!rows.length) return `<div class="card"><div class="card-title"><b>Similar Historical Profiles</b></div><div class="empty">No prior-season historical matches are available.</div></div>`;
  const body=rows.map(x=>{
    const season=Number(x.season)||activeSeason();
    const raceNum=Number(x.race_num);
    const raceText=Number.isFinite(raceNum) ? String(Math.round(raceNum)) : '—';
    const score=Number(x.similarity);
    const trackTitle=escapeHtml(x.track_name||'');
    return `<div class="similar-row">
      <div class="similar-year">${season}</div>
      <div>${numberTile(x.car||'—','micro',false,season,x.series||series)}</div>
      <div class="similar-driver" title="${escapeHtml(x.driver||'Unknown driver')}">${escapeHtml(x.driver||'Unknown driver')}</div>
      <div class="similar-race" title="${trackTitle}">${escapeHtml(raceText)}</div>
      <div class="similar-score">${Number.isFinite(score)?Math.round(score)+'%':'—'}</div>
      <div class="similar-finish">${Number.isFinite(Number(x.finish))?Math.round(Number(x.finish)):'—'}</div>
    </div>`;
  }).join('');
  return `<div class="card">
    <div class="card-title"><b>Similar Historical Profiles</b></div>
    <div class="similar-table">
      <div class="similar-head"><div>Year</div><div>Car</div><div>Driver</div><div>Race</div><div style="text-align:right">Sim.</div><div style="text-align:right">Fin.</div></div>
      ${body}
    </div>
  </div>`;
}

function driverCard(d){
  if(!d) return '<div class="empty">Driver missing.</div>';
  const med = d.median_finish ?? (d.pmf ? medianFromPmf(d.pmf) : 0);
  const metaBits = [d.manufacturer, d.team].filter(Boolean).map(escapeHtml).join(' · ');
  const nameHtml = driverName(d) !== `Car #${d.car}`
    ? `<div style="font-family:var(--mono);font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px;">${escapeHtml(driverName(d))}</div><div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:4px;">Car #${escapeHtml(d.car)}</div>${metaBits ? `<div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:10px;">${metaBits}</div>` : ''}`
    : `<div style="font-family:var(--mono);font-size:15px;font-weight:700;color:var(--text);margin-bottom:10px;">Car #${escapeHtml(d.car)}</div>${metaBits ? `<div style="font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:10px;">${metaBits}</div>` : ''}`;
  return `<div class="card">
    <div class="detail-top">${numberTile(d.car, 'big')}</div>
    ${nameHtml}
    ${limitedHistoryNotice(d)}
    <div class="stat-compact">
      ${(mode === 'last_race' || mode === 'historical') ? `<div class="label">Finish</div><div class="value">${fmtActual(d)}</div>` : ''}
      ${(mode === 'last_race' || mode === 'historical' || activeData()?.meta?.mode_meta?.qualifying_available === true) ? `<div class="label">Start</div><div class="value">${fmtStart(d)}</div>` : ''}
      <div class="label">Prediction</div><div class="value">${Math.round(Number(med)||0)}</div>
      <div class="label">Expected value</div><div class="value">${Number(d.expected_finish||0).toFixed(1)}</div>
    </div>
    <div class="market-list">${marketBars(d)}</div>
  </div>${similarHistoricalCard(d)}`;
}
function h2h(a,b){
  const pa=a.pmf||[], pb=b.pmf||[]; let aw=0,bw=0,tie=0;
  for(let i=0;i<pa.length;i++) for(let j=0;j<pb.length;j++){
    const p=pa[i]*pb[j]; if(i<j) aw+=p; else if(j<i) bw+=p; else tie+=p;
  }
  return [aw+tie/2,bw+tie/2];
}
function bestOf(ds){
  const n=ds.length; const out=Object.fromEntries(ds.map(d=>[d.car,0]));
  const pmfs=ds.map(d=>d.pmf||[]); const maxLen=Math.max(...pmfs.map(p=>p.length));
  for(let k=1;k<=maxLen;k++){
    const eq=pmfs.map(p=>p[k-1]||0);
    const worse=pmfs.map(p=>p.slice(k).reduce((a,b)=>a+b,0));
    for(let mask=1; mask<(1<<n); mask++){
      let prob=1, count=0;
      for(let i=0;i<n;i++){
        if(mask&(1<<i)){ prob*=eq[i]; count++; }
        else prob*=worse[i];
      }
      if(prob>0){ for(let i=0;i<n;i++) if(mask&(1<<i)) out[ds[i].car]+=prob/count; }
    }
  }
  return out;
}
function compareCard(ds){
  const best=bestOf(ds);
  const rows=ds
    .slice()
    .sort((a,b)=>best[b.car]-best[a.car])
    .map(d=>`<div class="compare-simple-row">
      <div>${numberTile(d.car, 'small')}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${best[d.car]*100}%;background:${driverChartColor(d.car)}"></div></div>
      <div class="bar-val">${fmtP(best[d.car])}</div>
    </div>`).join('');
  return `<div class="card"><div class="compare-simple">${rows}</div></div>`;
}
function baselineValue(d, key){
  if(key === 'expected_finish') return Number(d.expected_finish);
  if(key === 'prediction') return predictionValue(d);
  if(key === 'median_finish') return Number(d.median_finish ?? (d.pmf ? medianFromPmf(d.pmf) : NaN));
  if(key === 'baseline_last10_p50_finish') return Number(d.baseline_last10_p50_finish);
  if(key === 'starting_position') return Number(d.starting_position);
  if(d.baselines && d.baselines[key] != null) return Number(d.baselines[key]);
  return NaN;
}
function completedScoreCard(){
  const ds = trackDrivers();
  if(ds.length < 5) return '';

  const qualifyingAvailable = activeData()?.meta?.mode_meta?.qualifying_available === true;
  const baselineDefs = [
    {name:'Tyler', key:'prediction', isTyler:true},
    ...(mode !== 'next_race' || qualifyingAvailable ? [{name:'Start Pos', key:'starting_position'}] : []),
    {name:'Last 10 Finish', key:'last10_median_finish', fallback:'baseline_last10_p50_finish'},
    {name:'Last 20 Finish', key:'last20_median_finish'},
    {name:'Last 36 Finish', key:'last36_median_finish'},
    {name:'Last 10 Avg Pos', key:'last10_median_avg_pos'},
    {name:'Last 20 Avg Pos', key:'last20_median_avg_pos'},
    {name:'Last 36 Avg Pos', key:'last36_median_avg_pos'},
  ];

  function valueFor(d, def){
    let v = baselineValue(d, def.key);
    if(!Number.isFinite(v) && def.fallback) v = baselineValue(d, def.fallback);
    return v;
  }

  function rankedBaseline(def){
    const eligible = ds.filter(d => Number.isFinite(valueFor(d, def)));
    if(eligible.length < 5) return null;
    const sorted = eligible.slice().sort((a,b) => {
      const cmp = valueFor(a, def) - valueFor(b, def);
      if(cmp !== 0) return cmp;
      return compareDrivers(a,b,'expected_finish','asc');
    });
    return {name:def.name, isTyler:!!def.isTyler, cars:sorted.slice(0,10), n:eligible.length};
  }

  const rows = baselineDefs.map(rankedBaseline).filter(Boolean);
  if(!rows.length) return '';

  if(mode === 'next_race'){
    return `<div class="card">
      <div class="card-title"><b>Prediction Comparison</b><span>projected top 10</span></div>
      <div class="prediction-rank">
        ${rows.map((r,i)=>`<div>
          <div class="prediction-rank-row">
            <div class="prediction-rank-num">${i+1}.</div>
            <div class="prediction-rank-name ${r.isTyler?'tyler':''}">${r.name}</div>
            <div class="prediction-rank-score"></div>
            <div class="prediction-rank-cars">${r.cars.map(d=>numberTile(d.car, 'tiny', true)).join('')}</div>
          </div>
        </div>`).join('')}
      </div>
      <div class="note">Scores and method rankings will appear after the race. For now, each row shows that method’s projected top 10. Start Position appears only after qualifying results are available.</div>
    </div>`;
  }

  const completed = ds.filter(d => Number.isFinite(Number(d.actual_finish)));
  if(completed.length < 5) return '';

  const scoredRows = rows.map(r => {
    const eligible = completed.filter(d => Number.isFinite(valueFor(d, baselineDefs.find(def => def.name === r.name))));
    if(eligible.length < 5) return null;
    const def = baselineDefs.find(def => def.name === r.name);
    const sorted = eligible.slice().sort((a,b) => {
      const cmp = valueFor(a, def) - valueFor(b, def);
      if(cmp !== 0) return cmp;
      return compareDrivers(a,b,'expected_finish','asc');
    });
    const rank = Object.fromEntries(sorted.map((d,i) => [String(d.car), i + 1]));
    const score = eligible.reduce((acc,d) => acc + Math.abs(Number(d.actual_finish) - rank[String(d.car)]), 0) / eligible.length;
    return {...r, score, cars:sorted.slice(0,10)};
  }).filter(Boolean);

  const randomN = completed.length;
  if(randomN >= 2){
    scoredRows.push({name:'Random', isTyler:false, isRandom:true, score:(randomN * randomN - 1) / (3 * randomN), cars:[], n:randomN});
  }
  scoredRows.sort((a,b) => a.score - b.score);
  if(scoredRows.length < 2) return '';

  const actualTop10 = completed.slice().sort((a,b) => Number(a.actual_finish) - Number(b.actual_finish)).slice(0,10);
  return `<div class="card">
    <div class="card-title"><b>Prediction Comparison</b><span>MAE · lower is better</span></div>
    <div class="prediction-rank">
      <div class="prediction-results">
        <div class="prediction-rank-row">
          <div class="prediction-rank-num">—</div>
          <div class="prediction-rank-name">Results</div>
          <div class="prediction-rank-score"></div>
          <div class="prediction-rank-cars">${actualTop10.map(d=>numberTile(d.car, 'tiny', true)).join('')}</div>
        </div>
      </div>
      ${scoredRows.map((r,i)=>`<div>
        <div class="prediction-rank-row">
          <div class="prediction-rank-num">${i+1}.</div>
          <div class="prediction-rank-name ${r.isTyler?'tyler':''}">${r.name}</div>
          <div class="prediction-rank-score">${r.score.toFixed(2)}${Number.isFinite(Number((SEASON_COMPARISON_CACHE.get(activeSeason())?.averages||{})[r.name])) ? ` <span class="prediction-season-avg">(${Number((SEASON_COMPARISON_CACHE.get(activeSeason())?.averages||{})[r.name]).toFixed(2)})</span>` : ''}</div>
          ${r.isRandom ? '' : `<div class="prediction-rank-cars">${r.cars.map(d=>numberTile(d.car, 'tiny', true)).join('')}</div>`}
        </div>
      </div>`).join('')}
    </div>
    <div class="note">Score = mean absolute error between each method’s predicted rank and actual finish. Ties are broken by the model’s expected finish, then car number. Click any tiny car number to select that driver. Limited-history drivers are included; under-10 histories are padded with recent driver avg-position values, then team avg-position values, then start position if needed.</div>
  </div>`;
}

function renderPca(){
  const data = activeData();
  const panel = $('#pca-content');
  const meta = $('#pca-meta');
  const summary = data?.pca?.[track];
  if(!summary || !Array.isArray(summary.components)){
    meta.textContent = '—';
    panel.innerHTML = '<div class="empty">Rebuild predictions to generate PCA component summaries.</div>';
    return;
  }
  const observedVariables = summary.observed_variables ?? summary.raw_variables ?? summary.n_features ?? 133;
  meta.innerHTML = `${observedVariables} observed variables<br>${summary.retained_components} principal components`;
  panel.innerHTML = summary.components.map(c => {
    const loadingText = (c.top_loadings||[]).map(x => `${x.feature} ${Number(x.loading)>=0?'+':''}${Number(x.loading).toFixed(2)}`).join(' · ');
    const driverLimit = Number(c.component) === 1 ? 20 : 5;
    const shownDrivers = (c.drivers||[]).slice(0, driverLimit);
    const tiles = shownDrivers.map(x => `<div class="pca-driver-contribution" title="PC${c.component} improves car #${escapeHtml(x.car)} raw EV by ${Number(x.ev_help||0).toFixed(3)} positions before Sinkhorn">${numberTile(x.car, 'tiny', true)}<div class="pca-driver-ev">+${Number(x.ev_help||0).toFixed(2)}</div></div>`).join('');
    return `<div class="pca-component">
      <div class="pca-component-head">
        <div class="pca-component-name">PC${c.component}</div>
        <div class="pca-component-impact">avg |ΔEV| ${Number(c.mean_abs_help||0).toFixed(2)} · ${(100*Number(c.explained_variance||0)).toFixed(1)}%</div>
      </div>
      <div class="pca-driver-tiles">${tiles || '<span class="empty">No driver helped</span>'}</div>
      <div class="pca-loadings">${escapeHtml(loadingText)}</div>
    </div>`;
  }).join('');
}

function renderSide(){
  $('#selected-count').textContent=selected.size;
  const clearBtn = $('#clear-selection');
  if(clearBtn) clearBtn.style.display = selected.size ? '' : 'none';
  const cars=[...selected]; const el=$('#side-content');
  if(cars.length===0){
    $('#side-title').textContent=(mode === 'last_race' || mode === 'historical') ? 'Race Review' : 'Driver Detail';
    const score = completedScoreCard();
    el.innerHTML=score + '<div class="empty">Select one driver to see cumulative markets. Select multiple drivers to compare.</div>';
    return;
  }
  const ds=cars.map(getDriver).filter(Boolean);
  if(ds.length===1){
    $('#side-title').textContent='Driver Detail';
    el.innerHTML=driverCard(ds[0]);
    return;
  }
  $('#side-title').textContent='Driver Comparison';
  el.innerHTML=compareCard(ds);
}
// The track type is determined by the selected race, not a user-adjustable view.
function buildTrackButtons(){
  document.querySelectorAll('[data-track], [data-track-divider]').forEach(b=>b.remove());
}
$('#display-select').onchange=e=>{ displayMode=e.target.value; render(); };
$('#series-select').onchange=e=>setSeries(e.target.value);
$('#manufacturer-select').onchange=e=>{ if(e.target.value) selectManufacturer(e.target.value); };
$('#team-select').onchange=e=>{ if(e.target.value) selectTeam(e.target.value); };
$('#clear-selection').onclick=()=>{ selected.clear(); $('#manufacturer-select').value=''; $('#team-select').value=''; render(); };
$('#search').oninput=e=>{query=e.target.value.trim(); render();};
$('#hist-year').onchange=async function(){
  populateHistoricalRaceSelect();
  DATA_HIST=null;
  updateRunButton();
  await loadSelectedHistorical();
  render();
};
$('#hist-race').onchange=async function(){
  DATA_HIST=null;
  updateRunButton();
  await loadSelectedHistorical();
  render();
};

// Augment render to rebuild track buttons on each call
const _origRender = render;
(function patchRender(){
  const base = render;
  window.render = function(){
    buildTrackButtons();
    base();
  };
})();

// Load prediction files and any saved historical backtests
const errMsg = '<div class="empty">Could not load prediction files. Run predict.py, then serve this folder with <code>python3 -m http.server 8000</code>.</div>';
(async function boot(){
  try{
    $('#series-select').value='cup';
    applySeriesTheme();
    await loadSeriesData();
    if(!DATA_LAST&&!DATA_NEXT&&!HIST_INDEX.length){
      $('#rank-list').innerHTML='<div class="empty">No data yet — click <b>↻ Refresh data</b> in the toolbar to get started.</div>';
      return;
    }
    render();
  }catch(err){$('#rank-list').innerHTML=errMsg;console.error(err);}
})();

</script>
